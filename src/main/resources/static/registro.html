<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Cerrajería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/registro.css">
    <link rel="stylesheet" href="/css/chatbot.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="logo-icon"><img src="/images/Logo.png" alt="Cerrajería Ortega" style="height:56px;width:auto;"></div>
                <h1>Crear cuenta</h1>
                <p>Únete a nuestra cerrajería</p>
            </div>

            <form id="form-registro">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre <span class="requerido">*</span></label>
                        <input type="text" id="nombre" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="apellidos">Apellidos <span class="requerido">*</span></label>
                        <input type="text" id="apellidos" placeholder="Tus apellidos" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="requerido">*</span></label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña <span class="requerido">*</span></label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <div class="tel-group">
                        <select id="telefono-prefijo" class="prefijo-select">
                            <option value="+34">ES +34</option>
                            <option value="+1">US +1</option>
                            <option value="+44">GB +44</option>
                            <option value="+33">FR +33</option>
                            <option value="+49">DE +49</option>
                            <option value="+39">IT +39</option>
                            <option value="+351">PT +351</option>
                            <option value="+52">MX +52</option>
                            <option value="+54">AR +54</option>
                            <option value="+57">CO +57</option>
                            <option value="+56">CL +56</option>
                            <option value="+51">PE +51</option>
                            <option value="+58">VE +58</option>
                            <option value="+598">UY +598</option>
                            <option value="+595">PY +595</option>
                            <option value="+593">EC +593</option>
                        </select>
                        <input type="tel" id="telefono" placeholder="600 000 000" maxlength="11" autocomplete="tel">
                    </div>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" placeholder="Calle, número, ciudad">
                </div>

                <div id="mensaje" class="mensaje oculto"></div>

                <button type="submit" id="btn-submit" class="btn-submit">Registrarse</button>
            </form>

            <p class="link-alternativo">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
        </div>
    </div>

    <script src="/js/registro.js"></script>
    <script src="/js/chatbot.js"></script>
</body>
</html>
