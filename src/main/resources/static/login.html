<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cerrajería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/chatbot.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="logo-icon"><img src="/images/Logo.png" alt="Cerrajería Ortega" style="height:56px;width:auto;"></div>
                <h1>Iniciar sesión</h1>
                <p>Accede a tu cuenta</p>
            </div>

            <form id="form-login">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Tu contraseña" required>
                </div>

                <div id="mensaje" class="mensaje oculto"></div>

                <button type="submit" id="btn-submit" class="btn-submit">Iniciar sesión</button>
            </form>

            <p class="link-alternativo">¿No tienes cuenta? <a href="/registro.html">Regístrate</a></p>
        </div>
    </div>

    <script src="/js/login.js"></script>
    <script src="/js/chatbot.js"></script>
</body>
</html>
